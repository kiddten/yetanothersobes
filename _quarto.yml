project:
  type: website
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!templates/**"

lang: ru

website:
  description: "Технические разборы: объяснения, схемы и работающие примеры."
  title: "Технические разборы"
  search: true
  repo-url: https://github.com/kiddten/yetanothersobes
  repo-branch: main
  repo-actions: [edit]
  navbar:
    left:
      - text: "Все разборы"
        href: index.qmd
    right:
      - text: "О проекте"
        href: about.qmd
format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme.scss]
    toc: true
    toc-title: "В этом разборе"
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    css: styles.css



